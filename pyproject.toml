[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse-ai"
version = "1.0.0"
description = "Explainable crypto news sentiment and market-impact research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CryptoPulse AI contributors" }]
dependencies = ["vaderSentiment>=3.3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ml = ["transformers>=4.44,<6", "torch>=2.2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
cryptopulse-validate = "cryptopulse.validation:main"
cryptopulse-finbert = "cryptopulse.finbert:main"
cryptopulse-entities = "cryptopulse.entity_resolution:main"
cryptopulse-events = "cryptopulse.events:main"
cryptopulse-index = "cryptopulse.indexing:main"
cryptopulse-research = "cryptopulse.research:main"
cryptopulse-pipeline = "cryptopulse.operations:main"
cryptopulse-scheduler = "cryptopulse.scheduler:main"
cryptopulse-api = "cryptopulse.api:main"
cryptopulse-monitor = "cryptopulse.monitoring:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptopulse = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
