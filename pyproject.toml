[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopulse-ai"
version = "0.1.0"
description = "Explainable crypto news sentiment and market-impact research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CryptoPulse AI contributors" }]
dependencies = ["vaderSentiment>=3.3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ml = ["transformers>=4.44,<6", "torch>=2.2,<3"]

[project.scripts]
cryptopulse-validate = "cryptopulse.validation:main"
cryptopulse-finbert = "cryptopulse.finbert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
