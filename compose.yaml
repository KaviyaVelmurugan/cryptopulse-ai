services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CRYPTOPULSE_ENV: production
      CRYPTOPULSE_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/var
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
